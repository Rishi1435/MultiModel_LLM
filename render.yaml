services:
  # Backend FastAPI Web Service
  - type: web
    name: multimodel-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # Frontend React Static Site
  - type: web
    name: multimodel-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
